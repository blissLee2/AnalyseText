<html>
    <head>
        <title>enter_text page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Enter text</h1>
        <p>
            Please enter a short text message to be analyzed below:
        </p>
        <form action="AddTextServlet.do" method="POST">
            <table>
                <tr>
                    <td>Short Text</td>
                    <td><textarea name="shrtMsg" rows="5" cols="30" ></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="SUBMIT TEXT"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
